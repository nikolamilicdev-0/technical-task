# Local Supabase stack for development. Omitted keys keep the CLI defaults; reference:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "kb"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# The migrations narrow these default Data API grants per table instead of granting from scratch.
auto_expose_new_tables = true

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
# No seed data: every row is created through the app.
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Mail catcher (Mailpit) for auth emails.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Sign-up returns a session immediately; hosted projects must disable "Confirm email" too.
enable_confirmations = false
